<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - Connexion</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

    <main class="auth_page">
        <div class="auth_card">
            <form action="#" method="post">
                <h1 class="auth_title">Se connecter</h1>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Entrer votre email" required>
                </div>
                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Entrer votre mot de passe" required>
                </div>
                <a href="#" class="auth_forgot">Mot de passe oublié ?</a>
                <button type="submit" class="btn btn--primary btn--block">Se connecter</button>
                <p class="auth_switch">Vous n'avez pas de compte ? <a href="inscription.html">Créez un nouveau compte</a></p>
            </form>
            <img class="auth_illustration" src="assets/images/login.png" alt="">
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
